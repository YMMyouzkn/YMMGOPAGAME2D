<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YMM GOPAGAME2D — محرك ألعاب ثنائية الأبعاد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#202020;--p1:#383838;--p2:#3f3f3f;--p3:#484848;--p4:#565656;--ln:#242424;--tx:#dcdcdc;--mu:#9a9a9a;--ac:#4fa8e8;--ac2:#3a7fc0;--pl:#ff8a4c;--ok:#6fce7f;--wn:#f3c04f;--er:#ff6161;--cd:#4fa8e8;--at:#f3c04f;--r:6px;
--f:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.5 var(--f);-webkit-tap-highlight-color:transparent;overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
:root{padding-top:var(--sat);padding-bottom:var(--sab)}
html{scroll-padding-top:var(--sat)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--p4);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none;line-height:0}
#app{height:100%;display:flex;flex-direction:column}
/* top bar */
#top{height:50px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--p1);border-bottom:1px solid var(--ln)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.5px;cursor:pointer;flex:none}
.logo .mk{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--ac),#6c7cff 60%,var(--pl));display:grid;place-items:center;box-shadow:0 2px 14px rgba(60,200,212,.3)}
.logo .mk svg{width:18px;height:18px}
.logo b{font-size:15px;direction:ltr}.logo b i{font-style:normal;color:var(--ac);font-weight:600}
.pname{margin-inline-start:6px;background:transparent;border:1px solid transparent;border-radius:7px;padding:4px 8px;min-width:0;width:170px;font-weight:600}
.pname:hover,.pname:focus{background:var(--p2);border-color:var(--ln)}
.grow{flex:1}.sp{width:1px;height:22px;background:var(--ln);margin:0 4px;flex:none}
.saved{font-size:12px;color:var(--mu);white-space:nowrap}.saved.dirty{color:var(--wn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--ln);background:var(--p2);cursor:pointer;white-space:nowrap;font-weight:500;transition:background .12s,border-color .12s}
.btn:hover{background:var(--p3);border-color:var(--p4)}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#04292c;font-weight:600}.btn.pri:hover{background:#5fd8e2}
.btn.play{background:var(--pl);border-color:var(--pl);color:#2c0f06;font-weight:700;padding:0 16px}.btn.play:hover{background:#ff9274}
.btn.dng{color:var(--er)}.btn.sm{height:28px;padding:0 9px;font-size:13px}.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--p2)}
.btn[disabled]{opacity:.4;pointer-events:none}
.ib{width:34px;padding:0}.ib.sm{width:28px}
.btn.on{background:rgba(60,200,212,.16);border-color:var(--ac2);color:var(--ac)}
/* work area — Unity-style: Hierarchy(L) / Scene(C) / Inspector(R) / Project(bottom) */
#work{flex:1;min-height:0;display:grid;direction:ltr;
 grid-template-columns:250px minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr) 220px;
 grid-template-areas:"hier scene insp" "proj proj proj"}
.dock{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--p1);direction:rtl}
#dockA{grid-area:hier;border-right:1px solid var(--ln)}
#dockB{grid-area:insp;border-left:1px solid var(--ln)}
#dockC{grid-area:proj;border-top:1px solid var(--ln)}
.dockrow{flex:1;min-height:0;display:flex;flex-direction:row}
.dockrow>.tabs{flex-direction:column;padding:8px 6px;border-bottom:0;border-inline-end:1px solid var(--ln);width:118px;flex:none}
.dockrow>.tabs .tab{border-radius:7px;justify-content:flex-start}
.dockrow>.tabs .tab.on{border-bottom-color:transparent}
.dockrow>.dbody{flex:1}
.dockhdr{flex:none;padding:8px 10px 2px;font-size:12.5px;font-weight:700;color:var(--tx);display:flex;align-items:center;gap:7px}
.dockhdr .en{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mu);direction:ltr}
.dockhdr .qa{margin-inline-start:auto}
#center{direction:rtl}
.tabs{display:flex;gap:2px;padding:6px 6px 0;overflow-x:auto;flex:none;border-bottom:1px solid var(--ln);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;padding:7px 11px;border:0;background:transparent;color:var(--mu);border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;font-weight:500;border-bottom:2px solid transparent}
.tab:hover{color:var(--tx)}.tab.on{color:var(--ac);border-bottom-color:var(--ac);background:var(--p2)}
.dbody{flex:1;min-height:0;overflow:auto;padding:10px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.ph b{font-weight:600}
.empty{color:var(--mu);text-align:center;padding:18px 8px;font-size:13px;border:1px dashed var(--ln);border-radius:var(--r)}
.list{display:flex;flex-direction:column;gap:5px}
.item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;background:var(--p2);border:1px solid transparent;cursor:pointer;min-width:0;user-select:none;-webkit-user-select:none}
.item:hover{background:var(--p3)}.item.sel{border-color:var(--ac2);background:rgba(60,200,212,.1)}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.item .mt{font-size:11px;color:var(--mu)}
.thumb{width:36px;height:36px;border-radius:7px;background:repeating-conic-gradient(#232c39 0 25%,#1a212c 0 50%) 0 0/10px 10px;flex:none}
.grip{cursor:grab;color:var(--mu);touch-action:none;padding:4px}
.badge{font-size:10.5px;padding:1px 7px;border-radius:20px;background:var(--p4);color:var(--mu)}
/* center */
#center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
#vtabs{flex:none;display:flex;gap:4px;padding:6px 8px;background:var(--p1);border-bottom:1px solid var(--ln);overflow-x:auto;scrollbar-width:none}
#vtabs::-webkit-scrollbar{display:none}
.vtab{display:flex;align-items:center;gap:7px;height:32px;padding:0 14px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--mu);cursor:pointer;font-weight:600;white-space:nowrap}
.vtab.on{background:var(--p3);color:var(--tx);border-color:var(--ln)}.vtab.on .ic{color:var(--ac)}
.scname{margin-inline-start:auto;display:flex;align-items:center;gap:6px;color:var(--mu);font-size:12.5px;white-space:nowrap}
#views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;overflow:auto}
.view.on{display:block}
#v-scene{overflow:hidden;background:#0b0f14}
#sc{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;outline:none}
.tbar{position:absolute;top:8px;inset-inline-start:8px;display:flex;gap:4px;padding:4px;background:rgba(20,26,35,.92);border:1px solid var(--ln);border-radius:11px;backdrop-filter:blur(6px);flex-wrap:wrap;max-width:calc(100% - 16px)}
.tbar .btn{height:32px;width:34px;padding:0;background:transparent;border-color:transparent}
.tbar .btn:hover{background:var(--p3)}.tbar .btn.on{background:rgba(60,200,212,.2);color:var(--ac)}
.tbar .vs{width:1px;background:var(--ln);margin:3px 2px}
.selbar{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);display:none;gap:3px;padding:4px;background:rgba(20,26,35,.94);border:1px solid var(--ln);border-radius:11px;max-width:calc(100% - 16px);overflow-x:auto}
.selbar.on{display:flex}.selbar .btn{height:32px;width:34px;padding:0;background:transparent;border-color:transparent;flex:none}.selbar .btn:hover{background:var(--p3)}
.status{position:absolute;bottom:6px;inset-inline-start:10px;font-size:11.5px;color:var(--mu);direction:ltr;pointer-events:none;background:rgba(13,17,23,.7);padding:2px 8px;border-radius:6px}
.hint{position:absolute;inset:auto 0 60px 0;text-align:center;color:var(--mu);pointer-events:none;font-size:13px}
/* forms */
.sec{border:1px solid var(--ln);border-radius:var(--r);background:var(--p2);margin-bottom:10px;overflow:hidden}
.sh{display:flex;align-items:center;gap:8px;padding:8px 10px;font-weight:600;cursor:pointer;user-select:none;background:var(--p3)}
.sh .ic{color:var(--ac)}.sh .sx{margin-inline-start:auto;color:var(--mu);transition:transform .15s}.sec.cl .sx{transform:rotate(90deg)}.sec.cl .sb{display:none}
.sb{padding:8px 10px;display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:8px;min-height:30px}
.row .lb{flex:0 0 40%;color:var(--mu);font-size:12.5px}
.row>input:not([type=checkbox]):not([type=color]),.row>select,.row>textarea{flex:1;min-width:0}
.two{display:flex;gap:6px;flex:1;min-width:0}.two>input{flex:1;min-width:0;width:50%}
input[type=text],input[type=number],input:not([type]),select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:7px;padding:5px 8px;height:30px;min-width:0}
textarea{height:auto;min-height:64px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{border-color:var(--ac2);outline:none}
input[type=color]{width:38px;height:30px;padding:2px;background:var(--bg);border:1px solid var(--ln);border-radius:7px;cursor:pointer}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac)}
input[type=range]{flex:1;accent-color:var(--ac)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:left;font-size:13px}
.hr{height:1px;background:var(--ln);margin:2px 0}
.note{font-size:12px;color:var(--mu);line-height:1.6}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;border-radius:9px;background:var(--p2);border:1px solid transparent;cursor:pointer;font-size:11.5px;text-align:center;min-width:0}
.tile:hover{background:var(--p3)}.tile.sel{border-color:var(--ac2);background:rgba(60,200,212,.1)}
.tile canvas,.tile img,.tile .ph2{width:56px;height:56px;object-fit:contain;border-radius:6px;background:repeating-conic-gradient(#232c39 0 25%,#1a212c 0 50%) 0 0/10px 10px}
.tile .ph2{display:grid;place-items:center;color:var(--mu)}
.tile span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* events */
#v-events{padding:12px;background:var(--bg)}
.evbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.ev{border:1px solid var(--ln);border-radius:11px;background:var(--p1);margin-bottom:8px;overflow:hidden}
.ev.dis{opacity:.5}
.evh{display:flex;align-items:center;gap:4px;padding:4px 6px 4px 10px;background:var(--p2);border-bottom:1px solid var(--ln)}
.evh .n{font-weight:700;color:var(--mu);font-size:12px;margin-inline-end:auto}
.evb{display:grid;grid-template-columns:1fr 1fr}
.evc,.eva{padding:8px;display:flex;flex-direction:column;gap:5px;min-width:0}
.evc{border-inline-end:1px solid var(--ln)}
.ln{display:flex;align-items:flex-start;gap:6px;padding:6px 8px;border-radius:8px;cursor:pointer;background:var(--p2);border-inline-start:3px solid var(--cd);font-size:13px;line-height:1.7}
.eva .ln{border-inline-start-color:var(--at)}.ln:hover{background:var(--p3)}
.ln .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.ln .x{color:var(--mu);padding:2px;border-radius:5px;cursor:pointer;line-height:0}.ln .x:hover{color:var(--er);background:var(--p4)}
.pc{display:inline-block;padding:0 7px;border-radius:6px;background:rgba(60,200,212,.14);color:#9bf0f7;font-weight:600;margin:0 1px;max-width:100%;direction:auto}
.eva .pc{background:rgba(243,192,79,.14);color:#ffdc84}
.not{font-size:10.5px;background:var(--er);color:#25060a;border-radius:5px;padding:0 5px;font-weight:700;margin-inline-end:4px}
.addl{display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px dashed var(--ln);border-radius:8px;color:var(--mu);cursor:pointer;background:transparent;font-size:12.5px}
.addl:hover{color:var(--tx);border-color:var(--mu)}
.evs{padding:0 8px 8px;margin-inline-start:22px;border-inline-start:2px solid var(--p4);margin-inline-end:8px}
.evcm{display:flex;align-items:center;gap:8px;padding:6px 10px;color:#9ec08a;background:rgba(89,211,138,.07);border:1px solid rgba(89,211,138,.25);border-radius:10px;margin-bottom:8px}
.evcm textarea{flex:1;background:transparent;border:0;height:auto;min-height:24px;padding:2px;color:#b9dca6;resize:none;overflow:hidden}
/* animations view */
#v-anim{padding:12px}
.anwrap{display:grid;grid-template-columns:220px 1fr;gap:12px;height:100%}
.anprev{width:180px;height:180px;background:repeating-conic-gradient(#232c39 0 25%,#1a212c 0 50%) 0 0/16px 16px;border-radius:12px;border:1px solid var(--ln);display:block}
.frames{display:flex;gap:6px;overflow-x:auto;padding:6px 2px;flex-wrap:wrap}
.fr{width:64px;height:64px;border:2px solid transparent;border-radius:9px;background:var(--p2);cursor:pointer;position:relative;padding:2px}
.fr.sel{border-color:var(--ac)}.fr canvas{width:100%;height:100%;image-rendering:pixelated;border-radius:6px;background:repeating-conic-gradient(#232c39 0 25%,#1a212c 0 50%) 0 0/8px 8px}
.fr i{position:absolute;top:1px;inset-inline-start:4px;font-size:10px;font-style:normal;color:#fff;text-shadow:0 1px 2px #000}
/* mobile nav */
#bnav{display:none}
/* modal / toast */
.mbd{position:fixed;inset:0;background:rgba(3,6,10,.66);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.mbox{background:var(--p1);border:1px solid var(--ln);border-radius:14px;width:min(480px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mbox.wide{width:min(720px,100%)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--ln);font-weight:700}
.mb{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.mf{display:flex;gap:8px;justify-content:flex-start;padding:10px 14px;border-top:1px solid var(--ln)}
.pick{display:flex;flex-direction:column;gap:4px}
.pick .cat{margin-top:8px;font-size:12px;color:var(--mu);font-weight:600}
.pick .opt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--p2);cursor:pointer;border:1px solid transparent}
.pick .opt:hover{background:var(--p3);border-color:var(--ln)}
#toasts{position:fixed;bottom:calc(70px + var(--sab));left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--p4);border:1px solid var(--ln);padding:8px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:tin .2s;max-width:88vw}
.toast.err{border-color:var(--er);color:#ffc0c6}.toast.ok{border-color:var(--ok)}.toast.out{opacity:0;transition:opacity .3s}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
/* play */
#play{position:fixed;inset:0;z-index:150;background:#000;display:none}
#play.on{display:block}
#stage{position:absolute;inset:0}
#pbar{position:absolute;top:calc(8px + var(--sat));inset-inline-start:8px;z-index:5;display:flex;gap:6px}
#pbar .btn{background:rgba(20,26,35,.85);backdrop-filter:blur(6px)}
#dbg{position:absolute;bottom:0;inset-inline-end:0;width:min(360px,100%);max-height:45%;overflow:auto;background:rgba(10,14,20,.92);border:1px solid var(--ln);z-index:6;padding:8px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:left;display:none}
#dbg.on{display:block}#dbg .e{color:#ff8a96}#dbg .st{color:#9bf0f7;white-space:pre-wrap;word-break:break-all;margin-bottom:6px}
/* project manager */
#pm{position:fixed;inset:0;z-index:20;overflow:auto;background:var(--bg);background-image:linear-gradient(rgba(60,200,212,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(60,200,212,.045) 1px,transparent 1px);background-size:32px 32px;padding:calc(20px + var(--sat)) 20px 40px}
.pmw{max-width:1040px;margin:0 auto}
.pmh{display:flex;align-items:center;gap:14px;margin-bottom:26px;flex-wrap:wrap}
.bigmk{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--ac),#6c7cff 60%,var(--pl));display:grid;place-items:center;box-shadow:0 6px 30px rgba(60,200,212,.35)}
.bigmk svg{width:30px;height:30px}
.pmh h1{margin:0;font-size:30px;letter-spacing:1px;direction:ltr}.pmh h1 i{font-style:normal;color:var(--ac);font-weight:500}
.pmh p{margin:2px 0 0;color:var(--mu)}
.pmt{font-size:16px;font-weight:700;margin:24px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .12s,transform .12s;min-width:0}
.card:hover{border-color:var(--ac2);transform:translateY(-2px)}
.card .cv{height:78px;border-radius:9px;display:grid;place-items:center;font-size:30px;color:#fff;font-weight:700;overflow:hidden}
.card h3{margin:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card .d{color:var(--mu);font-size:12.5px;line-height:1.5}
.card .ac{display:flex;gap:4px;margin-top:auto}
/* responsive */
@media (max-width:1100px){#work{grid-template-columns:220px minmax(0,1fr) 270px}}
@media (max-width:900px){
 #work{display:flex;flex-direction:column;direction:rtl}
 #center{flex:1;order:1;min-height:0}
 .dock{order:2;display:none;height:50%;flex:none;border:0!important;border-top:1px solid var(--ln)!important}
 .dock.open{display:flex}
 .dockrow>.tabs{flex-direction:row;width:auto;border-inline-end:0;border-bottom:1px solid var(--ln);padding:6px 6px 0}
 #bnav{display:flex;flex:none;background:var(--p1);border-top:1px solid var(--ln);padding:4px 4px 2px;overflow-x:auto}
 #bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;border:0;color:var(--mu);padding:5px 0;font-size:10.5px;border-radius:8px;cursor:pointer;white-space:nowrap}
 #bnav button.on{color:var(--ac);background:var(--p2)}
 .pname{width:90px}.logo b{display:none}.saved,.hidem{display:none}
 .evb{grid-template-columns:1fr}.evc{border-inline-end:0;border-bottom:1px solid var(--ln)}
 .anwrap{grid-template-columns:1fr}
 .btn.play span.t{display:none}.btn.play{padding:0 12px}
 .mbd{align-items:flex-end;padding:0}.mbox,.mbox.wide{width:100%;border-radius:16px 16px 0 0;max-height:92vh}
 #vtabs .scname{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="logo" id="logo" title="مدير المشاريع"><span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#04222a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14L5 19h14"/></svg></span><b>YMM<i> GOPAGAME2D</i></b></div>
    <input class="pname" id="pname" aria-label="اسم المشروع">
    <span class="saved" id="saved"></span>
    <div class="grow"></div>
    <button class="btn ib ghost" id="bUndo" title="تراجع (Ctrl+Z)"></button>
    <button class="btn ib ghost" id="bRedo" title="إعادة (Ctrl+Y)"></button>
    <div class="sp hidem"></div>
    <button class="btn hidem" id="bSave"></button>
    <button class="btn hidem" id="bExport"></button>
    <button class="btn play" id="bPlay"></button>

/* ----- starter assets (generated procedurally) ----- */
function mkSheet(w,h,n,fn){const c=document.createElement('canvas');c.width=w*n;c.height=h;const x=c.getContext('2d');for(let f=0;f<n;f++)fn(x,f*w,f);return c.toDataURL('image/png')}
let _starter=null;
function starterAssets(){
  if(_starter)return clone(_starter);
  const A=[];const add=(id,name,w,h,n,fn)=>A.push({id,name,type:'image',w:w*n,h,cell:[w,h,n],data:mkSheet(w,h,n,fn)});
  add('a_hero','hero_sheet',32,32,7,(c,o,f)=>{
    const bob=f<2?f:0,run=f>=2&&f<=5?f-2:-1,jump=f===6;
    c.fillStyle='#16303a';
    if(jump){c.fillRect(o+9,25,5,5);c.fillRect(o+18,25,5,5)}
    else if(run>=0){const a=(run%2)*3;c.fillRect(o+8+a,25-(run%2),5,5+(run%2));c.fillRect(o+19-a,25-((run+1)%2),5,5+((run+1)%2))}
    else{c.fillRect(o+9,25,5,5);c.fillRect(o+18,25,5,5)}
    c.fillRect(o+6,7+bob,20,19-bob);c.fillStyle='#4dd0e1';c.fillRect(o+7,8+bob,18,17-bob);
    c.fillStyle='#8be9f1';c.fillRect(o+7,8+bob,18,3);
    c.fillStyle='#ffd166';c.fillRect(o+15,3+bob,2,5);c.fillRect(o+14,2+bob,4,2);
    c.fillStyle='#fff';c.fillRect(o+12,13+bob,6,7);c.fillRect(o+19,13+bob,5,7);
    c.fillStyle='#16303a';c.fillRect(o+16,15+bob,2,4);c.fillRect(o+22,15+bob,2,4);
    if(jump){c.fillStyle='#4dd0e1';c.fillRect(o+3,11,3,6);c.fillRect(o+26,11,3,6)}
  });
  add('a_coin','coin_sheet',32,32,6,(c,o,f)=>{
    const w=Math.max(3,Math.abs(Math.cos(f/6*Math.PI))*20);c.fillStyle='#a96b0c';c.beginPath();c.ellipse(o+16,16,w/2+2,12,0,0,7);c.fill();
    c.fillStyle='#ffd23f';c.beginPath();c.ellipse(o+16,16,w/2,10,0,0,7);c.fill();
    if(w>8){c.fillStyle='#fff3b0';c.fillRect(o+14,10,3,12)}
  });
  add('a_slime','slime_sheet',32,32,4,(c,o,f)=>{
    const sq=[0,2,4,2][f],w=24+sq,h=16-sq;c.fillStyle='#1e6b3a';c.beginPath();c.ellipse(o+16,30-h/2,w/2+1,h/2+1,0,0,7);c.fill();
    c.fillStyle='#57d16e';c.beginPath();c.ellipse(o+16,30-h/2,w/2-1,h/2-1,0,0,7);c.fill();
    c.fillStyle='#fff';c.fillRect(o+10,30-h+2,5,5);c.fillRect(o+18,30-h+2,5,5);c.fillStyle='#111';c.fillRect(o+13,30-h+4,2,3);c.fillRect(o+21,30-h+4,2,3);
  });
  add('a_ground','ground',32,32,1,(c,o)=>{
    c.fillStyle='#6b4a2f';c.fillRect(o,0,32,32);c.fillStyle='#5a3d26';[[4,14],[18,20],[9,26],[24,12],[26,27]].forEach(p=>c.fillRect(o+p[0],p[1],4,3));
    c.fillStyle='#4cae5c';c.fillRect(o,0,32,9);c.fillStyle='#7fdc8a';c.fillRect(o,0,32,3);c.fillStyle='#3a8c48';for(let i=0;i<32;i+=6)c.fillRect(o+i,9,3,3);
  });
  add('a_brick','brick',32,32,1,(c,o)=>{
    c.fillStyle='#8f4b3a';c.fillRect(o,0,32,32);c.fillStyle='#5b2c22';c.fillRect(o,7,32,2);c.fillRect(o,15,32,2);c.fillRect(o,23,32,2);c.fillRect(o,31,32,1);
    [[8,0],[24,8],[8,16],[24,24]].forEach(p=>c.fillRect(o+p[0],p[1],2,8));c.fillStyle='#b8664f';c.fillRect(o,0,32,2);
  });
  add('a_crate','crate',32,32,1,(c,o)=>{
    c.fillStyle='#5a3b1a';c.fillRect(o,0,32,32);c.fillStyle='#b98545';c.fillRect(o+3,3,26,26);c.strokeStyle='#5a3b1a';c.lineWidth=3;c.beginPath();c.moveTo(o+4,4);c.lineTo(o+28,28);c.moveTo(o+28,4);c.lineTo(o+4,28);c.stroke();
  });
  add('a_spike','spike',32,32,1,(c,o)=>{
    c.fillStyle='#39404d';[0,16].forEach(x=>{c.beginPath();c.moveTo(o+x,32);c.lineTo(o+x+8,6);c.lineTo(o+x+16,32);c.fill()});
    c.fillStyle='#b9c3d3';[0,16].forEach(x=>{c.beginPath();c.moveTo(o+x+6,32);c.lineTo(o+x+8,10);c.lineTo(o+x+10,32);c.fill()});
  });
  add('a_flag','flag',32,32,1,(c,o)=>{
    c.fillStyle='#d0d6e0';c.fillRect(o+8,2,3,30);c.fillStyle='#ff5c6c';c.beginPath();c.moveTo(o+11,3);c.lineTo(o+29,9);c.lineTo(o+11,16);c.fill();
    c.fillStyle='#ffd23f';c.fillRect(o+5,0,9,3);
  });
  add('a_star','star',32,32,1,(c,o)=>{
    c.fillStyle='#ffd23f';c.beginPath();for(let i=0;i<10;i++){const r=i%2?6:14,a=-Math.PI/2+i*Math.PI/5;c.lineTo(o+16+Math.cos(a)*r,17+Math.sin(a)*r)}c.fill();
    c.fillStyle='#fff3b0';c.fillRect(o+14,10,3,4);
  });
  add('a_gem','gem',32,32,1,(c,o)=>{
    c.fillStyle='#8a2fc4';c.beginPath();c.moveTo(o+16,3);c.lineTo(o+28,14);c.lineTo(o+16,29);c.lineTo(o+4,14);c.fill();
    c.fillStyle='#c46bff';c.beginPath();c.moveTo(o+16,3);c.lineTo(o+22,14);c.lineTo(o+16,29);c.lineTo(o+10,14);c.fill();
    c.fillStyle='rgba(255,255,255,.7)';c.fillRect(o+12,8,3,3);
  });
  add('a_cloud','cloud',64,32,1,(c,o)=>{
    c.fillStyle='rgba(255,255,255,.85)';[[16,20,10],[30,15,13],[46,20,10],[32,23,14]].forEach(p=>{c.beginPath();c.arc(o+p[0],p[1],p[2],0,7);c.fill()});
  });
  add('a_heart','heart',32,32,1,(c,o)=>{
    c.fillStyle='#ff4d6d';c.beginPath();c.moveTo(o+16,28);c.bezierCurveTo(o+2,18,o+4,4,o+16,11);c.bezierCurveTo(o+28,4,o+30,18,o+16,28);c.fill();
    c.fillStyle='rgba(255,255,255,.6)';c.fillRect(o+9,9,4,3);
  });
  add('a_ball','ball',32,32,1,(c,o)=>{
    c.fillStyle='#7a1f2b';c.beginPath();c.arc(o+16,16,15,0,7);c.fill();c.fillStyle='#ff5c6c';c.beginPath();c.arc(o+16,16,13,0,7);c.fill();
    c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.arc(o+11,11,4,0,7);c.fill();
  });
  add('a_wall','wall',32,32,1,(c,o)=>{
    c.fillStyle='#2b3345';c.fillRect(o,0,32,32);c.fillStyle='#3b465e';c.fillRect(o+1,1,30,14);c.fillRect(o+1,17,14,14);c.fillRect(o+17,17,14,14);
    c.fillStyle='#4a577a';c.fillRect(o+1,1,30,2);c.fillRect(o+1,17,14,2);c.fillRect(o+17,17,14,2);
  });
  add('a_floor','floor',32,32,1,(c,o)=>{
    c.fillStyle='#22301f';c.fillRect(o,0,32,32);c.fillStyle='#293a25';c.fillRect(o,0,16,16);c.fillRect(o+16,16,16,16);
  });
  _starter=A;return clone(A);
}

/* ----- project factories ----- */
function blankProject(name){return{v:1,id:uid('p'),name:name||'مشروع جديد',created:Date.now(),updated:Date.now(),
  settings:{width:960,height:540,gravityX:0,gravityY:1200,pixelArt:true,touch:'auto',startScene:null},globals:[],assets:[],objects:[],scenes:[]}}
function blankScene(name,W,H){return{id:uid('s'),name:name||'Scene',bg:'#1d2432',gravity:null,grid:32,
  layers:[{id:uid('l'),name:'Base',visible:true,locked:false,fixed:false,parallax:1}],instances:[],events:[],vars:[],
  camera:{x:(W||960)/2,y:(H||540)/2,zoom:1,follow:'',smooth:.12,ox:0,oy:0,bounds:{on:false,x:0,y:0,w:1920,h:540}}}}
function defObj(name,type,w,h,ex){return Object.assign({id:uid('o'),name,type,w,h,color:'#5b8def',shape:'rect',stroke:'',strokeW:2,asset:'',animations:[],defaultAnim:'',behaviors:[],vars:[],hit:0,tileScale:1,
  text:{content:'Text',size:24,color:'#ffffff',align:'left',bold:true,shadow:true}},ex||{})}
function migrate(p){
  p.settings=Object.assign({width:960,height:540,gravityX:0,gravityY:1200,pixelArt:true,touch:'auto',startScene:null},p.settings||{});
  p.globals=p.globals||[];p.assets=p.assets||[];p.objects=p.objects||[];p.scenes=p.scenes||[];
  p.objects.forEach(d=>{const b=defObj(d.name,d.type,d.w,d.h);for(const k in b)if(d[k]===undefined)d[k]=b[k]});
  p.scenes.forEach(s=>{const b=blankScene(s.name,p.settings.width,p.settings.height);for(const k in b)if(s[k]===undefined)s[k]=b[k];
    s.camera=Object.assign({},b.camera,s.camera);s.camera.bounds=Object.assign({},b.camera.bounds,s.camera.bounds||{});
    if(!s.layers.length)s.layers=b.layers});
  if(!p.settings.startScene&&p.scenes[0])p.settings.startScene=p.scenes[0].id;
  return p;
}

function frames(a,cw,n,ch){const f=[];for(let i=0;i<n;i++)f.push({a,sx:i*cw,sy:0,sw:cw,sh:ch||cw});return f}
function heroObj(){return defObj('Player','sprite',30,30,{asset:'a_hero',hit:.12,defaultAnim:'idle',

function makeTemplate(kind,name){
  const P=blankProject(name);P.assets=starterAssets();
  const S=P.settings,W=S.width,H=S.height;
  if(kind==='blank'){
    const sc=blankScene('Scene 1',W,H);P.scenes.push(sc);S.startScene=sc.id;
    sc.layers.push({id:uid('l'),name:'HUD',visible:true,locked:false,fixed:true,parallax:0});
    return P;

  const g=k=>{try{return ok?localStorage.getItem(k):mem[k]}catch(e){return mem[k]}};
  const s=(k,v)=>{if(ok){try{localStorage.setItem(k,v);return true}catch(e){return false}}mem[k]=v;return true};
  const d=k=>{if(ok){try{localStorage.removeItem(k)}catch(e){}}delete mem[k]};
  return{persistent:ok,
    index(){try{return JSON.parse(g('zil:idx')||'[]')}catch(e){return[]}},
    saveIndex(a){s('zil:idx',JSON.stringify(a))},
    get(id){const t=g('zil:p:'+id);try{return t?JSON.parse(t):null}catch(e){return null}},
    put(p){const r=s('zil:p:'+p.id,JSON.stringify(p));if(!r)return false;const ix=this.index().filter(x=>x.id!==p.id);ix.unshift({id:p.id,name:p.name,updated:p.updated,scenes:p.scenes.length,objects:p.objects.length});this.saveIndex(ix);return true},
    del(id){d('zil:p:'+id);this.saveIndex(this.index().filter(x=>x.id!==id))}};
})();

function h(tag,a){
  const e=document.createElement(tag);
  if(a)for(const n in a){const v=a[n];if(v==null||v===false)continue;
    if(n==='class')e.className=v;else if(n==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(n.slice(0,2)==='on')e.addEventListener(n.slice(2),v);else if(n==='html')e.innerHTML=v;
    else if(n==='value'||n==='checked'||n==='disabled'||n==='selected')e[n]=v;
    else e.setAttribute(n,v===true?'':v)}
  for(let i=2;i<arguments.length;i++)add(e,arguments[i]);
  return e;
}
function add(e,k){if(k==null||k===false)return;if(Array.isArray(k))k.forEach(x=>add(e,x));else e.appendChild(k.nodeType?k:document.createTextNode(String(k)))}

function libPointer(e,d,it){

  };
  const up=ev=>{

  };

function readAsset(file){
  return new Promise(res=>{
    const r=new FileReader();r.onerror=()=>res(null);
    r.onload=()=>{
      const data=r.result,nm=file.name.replace(/\.[^.]+$/,'');
      if(file.type.indexOf('image/')===0){
        const im=new Image();im.onerror=()=>res(null);
        im.onload=()=>{let w=im.naturalWidth,hh=im.naturalHeight,d=data;
          if(Math.max(w,hh)>2048){const k=2048/Math.max(w,hh),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(hh*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);d=c.toDataURL('image/png');w=c.width;hh=c.height}
          res({id:uid('a'),name:nm,type:'image',w,h:hh,data:d})};
        im.src=data;
      }else if(file.type.indexOf('audio/')===0){
        if(file.size>2.5e6)toast('الملف الصوتي كبير وقد لا يُحفظ في المتصفح','err');
        res({id:uid('a'),name:nm,type:'audio',data});
      }else res(null);
    };r.readAsDataURL(file);
  });
}

    lh.setUint16(10,0,true);lh.setUint16(12,0,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);
    lh.setUint16(26,nameB.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nameB,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0,true);ch.setUint16(10,0,true);
    ch.setUint16(12,0,true);ch.setUint16(14,0,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);
    ch.setUint16(28,nameB.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);ch.setUint16(34,0,true);ch.setUint16(36,0,true);
    ch.setUint32(38,0,true);ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),nameB);
    offset+=30+nameB.length+data.length;
  });
  const cdOffset=offset;let cdSize=0;central.forEach(p=>cdSize+=p.length);
  const eocd=new DataView(new ArrayBuffer(22));
  eocd.setUint32(0,0x06054b50,true);eocd.setUint16(8,files.length,true);eocd.setUint16(10,files.length,true);
  eocd.setUint32(12,cdSize,true);eocd.setUint32(16,cdOffset,true);
  const all=parts.concat(central,[new Uint8Array(eocd.buffer)]);
  let total=0;all.forEach(p=>total+=p.length);
  const out=new Uint8Array(total);let p=0;all.forEach(a=>{out.set(a,p);p+=a.length});
  return out;
}
function makeIconPNG(size){
  return new Promise(res=>{
    const c=document.createElement('canvas');c.width=size;c.height=size;const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,size,size);g.addColorStop(0,'#4fa8e8');g.addColorStop(.6,'#6c7cff');g.addColorStop(1,'#ff8a4c');
    const r=size*.22;x.fillStyle=g;x.beginPath();
    x.moveTo(r,0);x.lineTo(size-r,0);x.quadraticCurveTo(size,0,size,r);x.lineTo(size,size-r);x.quadraticCurveTo(size,size,size-r,size);
    x.lineTo(r,size);x.quadraticCurveTo(0,size,0,size-r);x.lineTo(0,r);x.quadraticCurveTo(0,0,r,0);x.closePath();x.fill();
    x.strokeStyle='#04222a';x.lineWidth=size*.1;x.lineCap='round';x.lineJoin='round';
    x.beginPath();x.moveTo(size*.24,size*.24);x.lineTo(size*.76,size*.24);x.lineTo(size*.24,size*.76);x.lineTo(size*.76,size*.76);x.stroke();
    c.toBlob(b=>{const r2=new FileReader();r2.onload=()=>res(new Uint8Array(r2.result));r2.readAsArrayBuffer(b)},'image/png');
  });
}

}

async function publishGame(){
  if(!S.P||!S.P.scenes.length){toast('لا يوجد مشهد للنشر','err');return}
  saveNow();
  const html=buildHTML();
  const name=safeName();
  toast('جارٍ نشر اللعبة…');
  const tryPost=async(url,body,headers)=>{
    const r=await fetch(url,{method:'POST',headers:headers||{'Content-Type':'application/json'},body:typeof body==='string'?body:JSON.stringify(body)});
    const txt=await r.text();
    let data=null;try{data=JSON.parse(txt)}catch(e){data={raw:txt}}
    return{ok:r.ok,status:r.status,data,txt};
  };
  try{
    let res=null;
    // محاولة واجهات شائعة لـ Worker
    const payloads=[
      [PUBLISH_BASE+'/publish',{name:name,title:S.P.name,html:html,project:S.P}],
      [PUBLISH_BASE,{name:name,title:S.P.name,html:html}],
      [PUBLISH_BASE+'/api/publish',{name:name,html:html}],
      [PUBLISH_BASE+'/upload',{name:name,html:html}]
    ];
    for(const [url,body] of payloads){
      try{
        res=await tryPost(url,body);
        if(res.ok||(res.data&&(res.data.url||res.data.id||res.data.link||res.data.path)))break;
      }catch(e){res={ok:false,err:String(e)}}
    }
    let link=null;
    if(res&&res.data){
      link=res.data.url||res.data.link||res.data.share||null;
      if(!link&&res.data.id)link=PUBLISH_BASE.replace(/\/$/,'')+'/'+res.data.id;
      if(!link&&res.data.path)link=PUBLISH_BASE.replace(/\/$/,'')+'/'+String(res.data.path).replace(/^\//,'');
    }
    if(link){
      const box=h('div',{class:'list'},
        h('div',{class:'note'},'تم نشر اللعبة بنجاح. انسخ الرابط وشاركه:'),
        h('input',{type:'text',value:link,readonly:true,style:{width:'100%',height:'36px',direction:'ltr',textAlign:'left'},id:'_pubLink'}),
        h('div',{class:'row',style:{gap:'6px',marginTop:'8px'}},
          btn('نسخ الرابط',{cls:'pri',onclick:()=>{const i=$('#_pubLink');i&&i.select();try{navigator.clipboard.writeText(link)}catch(e){}toast('تم النسخ','ok')}}),
          btn('فتح الرابط',{onclick:()=>window.open(link,'_blank')})
        ));
      modal({title:'نشر اللعبة',body:box,actions:[{label:'إغلاق'}]});
      toast('تم النشر','ok');
      return;
    }
    // fallback: عرض رابط القاعدة + تصدير HTML لرفعه يدويًا
    const slug=(S.P.id||uid('g')).replace(/[^a-zA-Z0-9_-]/g,'').slice(-12);
    const guess=PUBLISH_BASE.replace(/\/$/,'')+'/g/'+slug;
    const box=h('div',{class:'list'},
      h('div',{class:'note'},'تعذّر النشر التلقائي من المتصفح (قد يحتاج الـ Worker لضبط CORS أو مسار API). يمكنك:'),
      h('div',{class:'note'},'1) تصدير HTML ورفعه على الخدمة المرتبطة بهذا الرابط.'),
      h('div',{class:'note',style:{direction:'ltr',textAlign:'left'}},PUBLISH_BASE),
      h('input',{type:'text',value:guess,readonly:true,style:{width:'100%',height:'36px',direction:'ltr',textAlign:'left'},id:'_pubGuess'}),
      h('div',{class:'row',style:{gap:'6px',marginTop:'8px'}},
        btn('نسخ الرابط الأساسي',{cls:'pri',onclick:()=>{try{navigator.clipboard.writeText(PUBLISH_BASE)}catch(e){}toast('تم النسخ','ok')}}),
        btn('تصدير HTML',{onclick:()=>{exportHTML()}})
      ));
    modal({title:'نشر اللعبة',body:box,actions:[{label:'إغلاق'}]});
    if(res&&!res.ok)toast('الاستجابة: '+(res.status||'')+' — استخدم التصدير اليدوي','err');
  }catch(e){
    toast('فشل النشر: '+(e&&e.message||e),'err');
  }
}
